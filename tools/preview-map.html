<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>歐洲地圖預覽</title>
  <style>
    body { background:#10131c; margin:0; display:flex; justify-content:center; padding:20px; }
    canvas { border:2px solid #3c4a78; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="480"></canvas>
  <script src="../js/europe-geo.js"></script>
  <script>
    const ctx = document.getElementById('c').getContext('2d');
    // 海
    ctx.fillStyle = '#1d3a5c';
    ctx.fillRect(0,0,960,480);
    // 可用區域邊界（確認有沒有超出）
    ctx.strokeStyle = 'rgba(255,80,80,0.6)';
    ctx.setLineDash([5,5]);
    ctx.strokeRect(0, 46, 960, 382-46);
    ctx.setLineDash([]);

    function poly(pts, fill, stroke, lw) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
    }
    // 背景國家
    Object.keys(EuropeBackdrop).forEach(k => {
      EuropeBackdrop[k].shapes.forEach(s => poly(s, '#2b3850', 'rgba(150,180,215,0.26)', 1));
    });
    // 關卡國家
    Object.keys(EuropeGeo).forEach(k => {
      const g = EuropeGeo[k];
      g.shapes.forEach(s => poly(s, '#5f8052', 'rgba(225,238,255,0.5)', 1.2));
      // 圖釘點
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(g.center[0], g.center[1], 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '600 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.strokeText(k, g.center[0], g.center[1]-9);
      ctx.fillText(k, g.center[0], g.center[1]-9);
    });
  </script>
</body>
</html>
